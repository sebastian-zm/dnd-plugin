name: Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Build plugin
        run: npm run build && npm run build:mcpb

      - name: Release (versioned tag)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            dist/dnd-plugin.json \
            dist/mcp-server.mjs \
            dist/dnd-plugin.mcpb \
            --title "${{ github.ref_name }}" \
            --generate-notes

      - name: Release (rolling latest)
        if: github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --yes 2>/dev/null || true
          git push --delete origin latest 2>/dev/null || true
          gh release create latest \
            dist/dnd-plugin.json \
            dist/mcp-server.mjs \
            dist/dnd-plugin.mcpb \
            --title "Latest" \
            --notes "Automatically updated on every push to main." \
            --prerelease
